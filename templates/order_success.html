<!DOCTYPE html>
<html>

<head>

    <title>Order Confirmed</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f9ff;
        }

        .success-box {
            width: 90%;
            max-width: 550px;
            margin: 120px auto;
            background-color: white;
            padding: 50px 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #16823b;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background-color: #ff7a00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background-color: #e56700;
        }
    </style>

</head>

<body>

    <div class="success-box">

        <div class="icon">🎉</div>

        <h1>Order Placed Successfully!</h1>

        <p>
            Thank you for ordering with us.
        </p>

        <a href="/orders">
            View Orders
        </a>

        <a href="/menu">
            Continue Shopping
        </a>

    </div>

</body>

</html>
