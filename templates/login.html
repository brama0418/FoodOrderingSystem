<!DOCTYPE html>
<html>

<head>
    <title>Login - Food Ordering System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff3e6, #f5f9ff);
        }

        nav {
            background-color: #101d3b;
            padding: 15px 40px;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: auto;
        }

        .logo span {
            color: #ff7a00;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff7a00;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            margin: 80px auto;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #101d3b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #ff7a00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #e56700;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #ff7a00;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            🍔 <span>Food Ordering System</span>
        </div>

        <div>
            <a href="/">Home</a>
            <a href="/menu">Menu</a>
            <a href="/cart">Cart</a>
            <a href="/orders">Orders</a>
        </div>

    </nav>


    <div class="login-box">

        <h1>🔐 Login</h1>

        <form action="/login" method="POST">

            <label>Username</label>

            <input type="text" name="username" placeholder="Enter username" required>


            <label>Password</label>

            <input type="password" name="password" placeholder="Enter password" required>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

    </div>

</body>

</html>
