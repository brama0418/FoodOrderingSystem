<!DOCTYPE html>
<html>

<head>

    <title>Food Ordering System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: aliceblue;
        }

        nav {
            background-color: #302b63;
            padding: 15px;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #00bcd4;
        }

        .logout {
            background-color: #ff7a00;
            padding: 8px 15px;
            border-radius: 6px;
        }

        .logout:hover {
            background-color: #e56700;
            color: white;
        }

        h1 {
            text-align: center;
            margin-top: 100px;
            color: #302b63;
        }

        p {
            text-align: center;
            font-size: 18px;
            color: #555;
        }

</head>

<body>

    <nav>

        <div class="logo">
            🍔 Food Ordering System
        </div>

        <div>

            <a href="/">Home</a>

            <a href="/menu">Menu</a>

            <a href="/cart">Cart</a>

            <a href="/orders">Orders</a>

            <a href="/logout" class="logout">Logout</a>

        </div>

    </nav>


    <h1>
        Welcome to Food Ordering System
    </h1>

    <p>
        Order your favourite food online.
    </p>

</html>
